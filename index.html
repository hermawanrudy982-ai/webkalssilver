<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAL'S SILVER | Professional Asset System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; --card: #0f0f0f; --silver: #c0c0c0; --platinum: #e5e4e2; 
            --border: #222222; --text-main: #ffffff; --text-dim: #a0a0a0; --danger: #ff4d4d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .container { max-width: 1200px; margin: auto; padding: 0 20px; }
        .serif { font-family: 'Playfair Display', serif; }
        .text-silver { color: var(--silver); }
        .hidden { display: none !important; }
        
        /* HEADER */
        header { padding: 25px 0; border-bottom: 1px solid var(--border); position: sticky; top:0; background: rgba(5,5,5,0.95); z-index:100; backdrop-filter: blur(10px); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.6rem; letter-spacing: 5px; color: var(--platinum); text-decoration: none; font-weight: bold; text-transform: uppercase; }
        .cart-trigger { cursor: pointer; border: 1px solid var(--silver); padding: 7px 20px; color: var(--silver); font-weight: 600; border-radius: 2px; }

        /* HERO SLIDER */
        .hero-slider { padding: 40px 0; overflow: hidden; border-bottom: 1px solid var(--border); }
        .slider-track { display: flex; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; text-align: center; }
        .slide-img { width: 100%; max-width: 420px; height: 320px; object-fit: contain; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 50px 0; }
        .card { background: var(--card); border: 1px solid var(--border); text-align: center; position: relative; transition: 0.4s; border-radius: 4px; overflow: hidden; }
        .card:hover { border-color: var(--silver); transform: translateY(-5px); }
        .card-img-wrap { height: 260px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); position: relative; }
        .card-img { width: 80%; }
        .sales-counter { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: var(--silver); font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; border: 1px solid #333; }
        .stock-alert { color: var(--danger); font-size: 0.7rem; font-weight: bold; display: block; margin-bottom: 5px; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; justify-content: flex-end; }
        .modal-content { background: var(--bg); width: 100%; max-width: 600px; height: 100vh; overflow-y: auto; padding: 40px; border-left: 1px solid var(--border); }
        input, textarea { width: 100%; padding: 14px; background: #111; border: 1px solid var(--border); color: #fff; margin-bottom: 12px; border-radius: 3px; font-family: inherit; }
        .btn { background: var(--silver); border: 1px solid var(--silver); color: var(--bg); padding: 14px; cursor: pointer; font-weight: 700; width: 100%; text-transform: uppercase; border-radius: 2px; }
        .btn-alt { background: transparent; border: 1px solid #444; color: #888; margin-bottom: 12px; }

        /* PAYMENT & COPY */
        .payment-box { background: #0a0a0a; border: 1px solid var(--border); padding: 20px; margin: 20px 0; border-radius: 4px; }
        .copy-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .copy-btn { background: #222; border: 1px solid var(--silver); color: var(--silver); padding: 3px 10px; font-size: 0.65rem; cursor: pointer; border-radius: 3px; }

        /* ADMIN TABLE */
        .tab-nav { display: flex; margin-bottom: 25px; border-bottom: 1px solid var(--border); }
        .tab-nav button { flex: 1; padding: 15px; background: none; color: #666; border: none; cursor: pointer; font-weight: 600; }
        .tab-nav button.active { color: var(--silver); border-bottom: 2px solid var(--silver); }
        .admin-table-wrap { width: 100%; overflow-x: auto; }
        table { width: 100%; min-width: 500px; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #222; text-align: left; }
        .input-mini { width: 75px !important; margin: 0 !important; padding: 5px !important; text-align: center; background: #000; color: #fff; border: 1px solid #333; }

        footer { text-align: center; padding: 60px 0; border-top: 1px solid var(--border); font-size: 0.75rem; color: #555; letter-spacing: 2px; }
    </style>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <a href="#" class="logo" id="display-brand">KAL'S SILVER</a>
            <div class="cart-trigger" onclick="toggleModal('cart', true)">BAG (<span id="cart-count">0</span>)</div>
        </nav>
    </div>
</header>

<section class="hero-slider container">
    <div class="slider-track" id="slider-track"></div>
</section>

<main class="container">
    <div id="product-grid" class="grid"></div>
</main>

<div class="modal-overlay" id="modal-cart">
    <div class="modal-content">
        <h2 class="serif text-silver" style="font-size: 2rem;">Order Summary</h2>
        <div id="cart-items-list" style="margin-top:20px"></div>
        <button class="btn btn-alt" style="margin-top: 20px;" onclick="toggleModal('cart', false)">CONTINUE SHOPPING</button>

        <div id="checkout-section" class="hidden">
            <h3 class="serif text-silver" style="margin: 30px 0 15px;">Shipping Detail</h3>
            <input type="text" id="c-name" placeholder="Nama Lengkap">
            <input type="tel" id="c-hp" placeholder="Nomor WhatsApp">
            <textarea id="c-addr" rows="2" placeholder="Alamat Lengkap (Jalan / No. Rumah)"></textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <input type="text" id="c-desa" placeholder="Desa / Kelurahan">
                <input type="text" id="c-kec" placeholder="Kecamatan">
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <input type="text" id="c-kota" placeholder="Kota / Kabupaten">
                <input type="text" id="c-prov" placeholder="Provinsi">
            </div>

            <div class="payment-box">
                <p id="p-bank" style="font-weight: 600; font-size: 0.8rem;">Transfer BCA</p>
                <div class="copy-row">
                    <h3 id="p-acc-num" style="font-size: 1.4rem; color: var(--platinum);">8415 2822 52</h3>
                    <button class="copy-btn" onclick="copyText('p-acc-num')">SALIN</button>
                </div>
                <p id="p-acc-name" style="color: #888; font-size: 0.9rem;">a/n Kals Silver Investment</p>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 25px;">
                <span>Total Payment:</span>
                <h2 class="text-silver" id="grand-total">Rp 0</h2>
            </div>
            <button class="btn" onclick="finalizeOrder()">CHECKOUT VIA WHATSAPP</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-admin">
    <div class="modal-content" style="max-width: 850px;">
        <h2 class="serif text-silver">System Dashboard</h2>
        <div class="tab-nav">
            <button class="active" onclick="showTab('stock', this)">Inventory</button>
            <button onclick="showTab('add', this)">+ New Product</button>
            <button onclick="showTab('config', this)">Setting</button>
        </div>

        <div id="tab-stock" class="admin-table-wrap">
            <table>
                <thead><tr style="background: #111;"><th>Asset Name</th><th>Sold</th><th>Stock</th><th>Habis?</th><th>Act</th></tr></thead>
                <tbody id="admin-tbody"></tbody>
            </table>
        </div>

        <div id="tab-add" class="hidden">
            <input type="text" id="add-name" placeholder="Nama Produk">
            <input type="number" id="add-price" placeholder="Harga">
            <input type="number" id="add-sold" placeholder="Jumlah Terjual">
            <input type="number" id="add-stock" placeholder="Sisa Stok">
            <input type="text" id="add-img" placeholder="Link Gambar (PNG)">
            <button class="btn" onclick="addNewProduct()">PUBLISH ASSET</button>
        </div>

        <div id="tab-config" class="hidden">
            <label>Brand Name</label><input type="text" id="cfg-brand">
            <label>WhatsApp Admin (Format: 628...)</label><input type="tel" id="cfg-wa">
            <label>Bank Name</label><input type="text" id="cfg-bank">
            <label>Nomor Rekening</label><input type="text" id="cfg-acc-num">
            <label>Nama Pemilik Rekening</label><input type="text" id="cfg-acc-name">
            <button class="btn" onclick="updateConfig()">SAVE SETTINGS</button>
        </div>
        <button class="btn btn-alt" style="margin-top:20px" onclick="toggleModal('admin', false)">LOGOUT</button>
    </div>
</div>

<footer>
    <p>&copy; 2026 <span id="f-brand">KAL'S SILVER</span> | <span onclick="adminLogin()" style="cursor:pointer;">ADMIN PANEL</span></p>
</footer>

<script>
    // DATA SYSTEM
    let config = JSON.parse(localStorage.getItem('kals_config')) || {
        brand: "KAL'S SILVER", wa: "6281938302330",
        bank: "Transfer BCA", accNum: "8415 2822 52", accName: "a/n Kals Silver Investment"
    };

    let products = JSON.parse(localStorage.getItem('kals_db')) || [
        { id: 1, name: "PAMP Suisse 1oz Silver Bar", price: 650000, img: "https://www.pamp.com/media/catalog/product/cache/1/image/9df78eab33525d08d6e5fb8d27136e95/s/i/silver_bar_1oz_fortuna_front.png", isSoldOut: false, soldCount: 152, stock: 3 }
    ];

    let cart = [];

    window.onload = () => { applySystem(); renderShop(); initSlider(); };

    function applySystem() {
        document.getElementById('display-brand').innerText = config.brand;
        document.getElementById('f-brand').innerText = config.brand;
        document.getElementById('p-bank').innerText = config.bank;
        document.getElementById('p-acc-num').innerText = config.accNum;
        document.getElementById('p-acc-name').innerText = config.accName;
        document.getElementById('cfg-brand').value = config.brand;
        document.getElementById('cfg-wa').value = config.wa;
        document.getElementById('cfg-bank').value = config.bank;
        document.getElementById('cfg-acc-num').value = config.accNum;
        document.getElementById('cfg-acc-name').value = config.accName;
    }

    function initSlider() {
        const track = document.getElementById('slider-track');
        track.innerHTML = products.map(p => `<div class="slide"><img src="${p.img}" class="slide-img"></div>`).join('');
        let c = 0; setInterval(() => { c=(c+1)%products.length; track.style.transform=`translateX(-${c*100}%)`; }, 10000);
    }

    function renderShop() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = products.map(p => `
            <div class="card">
                <div class="card-img-wrap">
                    <img src="${p.img}" class="card-img" style="${p.isSoldOut ? 'opacity:0.1' : ''}">
                    <div class="sales-counter">${p.soldCount || 0} Terjual</div>
                </div>
                <div style="padding:20px">
                    ${(p.stock > 0 && p.stock < 10) ? `<span class="stock-alert">STOK TERBATAS: SISA ${p.stock}!</span>` : ''}
                    <h3 class="serif" style="font-size:0.9rem; height:45px; overflow:hidden;">${p.name}</h3>
                    <p style="color: var(--silver); font-weight: 600;">Rp ${p.price.toLocaleString()}</p>
                    <button class="btn" style="margin-top:15px" onclick="addToCart(${p.id})" ${p.isSoldOut ? 'disabled' : ''}>${p.isSoldOut ? 'HABIS' : 'BELI SEKARANG'}</button>
                </div>
            </div>`).join('');
    }

    function addToCart(id) {
        const p = products.find(i => i.id === id);
        const existing = cart.find(c => c.id === id);
        if (existing) existing.qty++; else cart.push({ ...p, qty: 1 });
        updateCartDisplay(); toggleModal('cart', true);
    }

    function updateCartDisplay() {
        const list = document.getElementById('cart-items-list');
        const count = document.getElementById('cart-count');
        const checkoutSec = document.getElementById('checkout-section');
        count.innerText = cart.reduce((total, item) => total + item.qty, 0);
        if (cart.length === 0) {
            list.innerHTML = "<p style='text-align:center; color:#555;'>Keranjang kosong.</p>";
            checkoutSec.classList.add('hidden');
            return;
        }
        checkoutSec.classList.remove('hidden');
        let totalVal = 0;
        list.innerHTML = cart.map((item, index) => {
            totalVal += item.price * item.qty;
            return `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222;">
                        <div><p>${item.name}</p><p style="color:var(--silver)">x${item.qty}</p></div>
                        <button onclick="updateQty(${index}, -1)" style="color:var(--danger); background:none; border:none; cursor:pointer;">Hapus</button>
                    </div>`;
        }).join('');
        document.getElementById('grand-total').innerText = "Rp " + totalVal.toLocaleString();
    }

    function updateQty(index, change) {
        cart[index].qty += change;
        if (cart[index].qty <= 0) cart.splice(index, 1);
        updateCartDisplay();
    }

    function copyText(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        alert("Nomor rekening berhasil disalin!");
    }

    function finalizeOrder() {
        const f = {
            name: document.getElementById('c-name').value,
            phone: document.getElementById('c-hp').value,
            addr: `${document.getElementById('c-addr').value}, ${document.getElementById('c-desa').value}, ${document.getElementById('c-kec').value}, ${document.getElementById('c-kota').value}, ${document.getElementById('c-prov').value}`
        };
        if (!f.name || !f.phone) return alert("Mohon lengkapi Nama dan WhatsApp!");

        // Generate Invoice YYMMDD + Random 4 Digit
        const now = new Date();
        const yy = now.getFullYear().toString().slice(-2);
        const mm = (now.getMonth() + 1).toString().padStart(2, '0');
        const dd = now.getDate().toString().padStart(2, '0');
        const inv = `INV-${yy}${mm}${dd}-${Math.floor(1000 + Math.random() * 9000)}`;

        let itemsText = cart.map(it => `- ${it.name} (x${it.qty})`).join('\n');
        
        let summary = `*ORDER ${inv}*\n\n*Items:*\n${itemsText}\n\n*Total:* ${document.getElementById('grand-total').innerText}\n\n*Detail Pelanggan:*\nNama: ${f.name}\nWA: ${f.phone}\nAlamat: ${f.addr}\n\n*Pembayaran ke:*\nBank: ${config.bank}\nNo. Rek: ${config.accNum}\na/n: ${config.accName}`;

        window.open(`https://wa.me/${config.wa}?text=${encodeURIComponent(summary)}`);
    }

    // ADMIN FUNCTIONS
    function adminLogin() { if(prompt("Passcode:") === "admin123") { renderAdmin(); toggleModal('admin', true); } }
    
    function showTab(t, b) {
        document.querySelectorAll('#tab-stock, #tab-add, #tab-config').forEach(el => el.classList.add('hidden'));
        document.getElementById('tab-'+t).classList.remove('hidden');
        document.querySelectorAll('.tab-nav button').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
    }

    function renderAdmin() {
        const tbody = document.getElementById('admin-tbody');
        tbody.innerHTML = products.map((p, i) => `
            <tr>
                <td>${p.name.substring(0,12)}..</td>
                <td><input type="number" value="${p.soldCount}" class="input-mini" onchange="products[${i}].soldCount=parseInt(this.value); saveAll()"></td>
                <td><input type="number" value="${p.stock}" class="input-mini" onchange="products[${i}].stock=parseInt(this.value); saveAll()"></td>
                <td><input type="checkbox" ${p.isSoldOut ? 'checked' : ''} onchange="products[${i}].isSoldOut=this.checked; saveAll()"></td>
                <td><button onclick="products.splice(${i},1); saveAll(); renderAdmin()" style="color:var(--danger); background:none; border:none; cursor:pointer;">X</button></td>
            </tr>`).join('');
    }

    function addNewProduct() {
        const n = document.getElementById('add-name').value;
        const p = parseInt(document.getElementById('add-price').value);
        const s = parseInt(document.getElementById('add-sold').value) || 0;
        const st = parseInt(document.getElementById('add-stock').value) || 0;
        const im = document.getElementById('add-img').value;
        if(!n || !p) return;
        products.push({ id: Date.now(), name: n, price: p, img: im, isSoldOut: false, soldCount: s, stock: st });
        saveAll(); renderAdmin(); alert("Produk Berhasil Ditambah!");
    }

    function updateConfig() {
        config = {
            brand: document.getElementById('cfg-brand').value,
            wa: document.getElementById('cfg-wa').value,
            bank: document.getElementById('cfg-bank').value,
            accNum: document.getElementById('cfg-acc-num').value,
            accName: document.getElementById('cfg-acc-name').value
        };
        localStorage.setItem('kals_config', JSON.stringify(config));
        applySystem(); alert("Sistem Berhasil Diupdate!");
    }

    function saveAll() { localStorage.setItem('kals_db', JSON.stringify(products)); renderShop(); }
    function toggleModal(m, s) { document.getElementById('modal-'+m).style.display = s ? 'flex' : 'none'; }
</script>
</body>
</html>
